services:
  db:
    image: postgres:16-alpine
    shm_size: 256mb
    environment:
      POSTGRES_DB: puroseka
      POSTGRES_PASSWORD: local-development-only
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d puroseka']
      interval: 3s
      retries: 20
volumes:
  pgdata:
